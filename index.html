<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alf AI</title>
  <script src="https://js.puter.com/v2/"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0b0f;
      color: white;
    }
    .wrap {
      max-width: 760px;
      margin: auto;
      padding: 20px 16px 60px;
    }
    h1 {
      margin: 8px 0 4px;
      font-size: 32px;
    }
    .sub {
      color: #aaa;
      margin-bottom: 24px;
    }
    .card {
      background: #17171c;
      border: 1px solid #2b2b33;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .tabs {
      display: flex;
      gap: 8px;
    }
    .tab {
      flex: 1;
      padding: 12px;
      border: 0;
      border-radius: 12px;
      background: #2a2a33;
      color: #ddd;
      font-weight: 700;
    }
    .tab.active {
      background: white;
      color: black;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 14px;
    }
    textarea, select {
      width: 100%;
      border-radius: 12px;
      border: 1px solid #3a3a45;
      background: #0b0b0f;
      color: white;
      padding: 12px;
      font-size: 16px;
    }
    textarea {
      min-height: 120px;
      resize: vertical;
    }
    .hidden { display: none; }
    .upload {
      border: 1px dashed #555;
      border-radius: 14px;
      padding: 16px;
      text-align: center;
    }
    .previewGrid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }
    .previewGrid img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 10px;
    }
    .btn {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 15px;
      font-size: 17px;
      font-weight: 800;
      background: white;
      color: black;
    }
    .btn:disabled { opacity: 0.5; }
    .secondary {
      width: 100%;
      border: 1px solid #3a3a45;
      border-radius: 12px;
      background: #24242d;
      color: white;
      padding: 12px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .small {
      font-size: 13px;
      color: #aaa;
      line-height: 1.4;
    }
    #status {
      display: none;
      text-align: center;
      color: #ddd;
      padding: 18px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #3a3a45;
      border-top-color: white;
      border-radius: 50%;
      margin: 0 auto 10px;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #error {
      display: none;
      background: #451010;
      border: 1px solid #7f2222;
      color: #ffb6b6;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    #result {
      display: none;
    }
    #result img, #result video {
      width: 100%;
      border-radius: 14px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>ALF AI</h1>
    <div class="sub">Image & video generator</div>

    <button id="loginBtn" class="secondary">Sign in to Puter</button>

    <div class="card">
      <div class="tabs">
        <button class="tab active" data-mode="create">Create Image</button>
        <button class="tab" data-mode="edit">Edit Image</button>
        <button class="tab" data-mode="video">Create Video</button>
      </div>
    </div>

    <div id="uploadCard" class="card hidden">
      <label>Reference image(s)</label>
      <div class="upload">
        <div class="small">Upload up to 3 reference images</div>
        <input id="fileInput" type="file" accept="image/*" multiple />
        <div id="previews" class="previewGrid"></div>
      </div>
    </div>

    <div class="card">
      <label id="promptTitle">Describe the image</label>
      <textarea id="prompt" placeholder="A highly realistic portrait photo of a man standing in London at night..."></textarea>
    </div>

    <div class="card" id="imageSettings">
      <label>Image model</label>
      <select id="imageModel">
        <option value="gpt-image-1-mini">GPT Image Mini</option>
        <option value="gemini-2.5-flash-image-preview">Gemini Image</option>
        <option value="grok-imagine-image">Grok Imagine</option>
      </select>
    </div>

    <div id="videoSettings" class="card hidden">
      <label>Video model</label>
      <select id="videoModel">
        <option value="veo-3.1-fast-generate-preview">Veo Fast</option>
        <option value="veo-3.1-lite-generate-preview">Veo Lite</option>
        <option value="sora-2">Sora 2</option>
      </select>
      <br><br>
      <label>Length</label>
      <select id="videoSeconds">
        <option value="4">4 seconds</option>
        <option value="6">6 seconds</option>
        <option value="8">8 seconds</option>
      </select>
    </div>

    <div id="error"></div>

    <button id="generateBtn" class="btn">Generate Image</button>

    <div id="status">
      <div class="spinner"></div>
      <div id="statusText">Generating...</div>
      <div class="small">Video can take longer than image generation.</div>
    </div>

    <div id="result" class="card">
      <label>Result</label>
      <div id="resultMedia"></div>
    </div>
  </div>

  <script>
    let mode = "create";
    let referenceImages = [];

    const tabs = document.querySelectorAll(".tab");
    const uploadCard = document.getElementById("uploadCard");
    const videoSettings = document.getElementById("videoSettings");
    const imageSettings = document.getElementById("imageSettings");
    const prompt = document.getElementById("prompt");
    const promptTitle = document.getElementById("promptTitle");
    const fileInput = document.getElementById("fileInput");
    const previews = document.getElementById("previews");
    const generateBtn = document.getElementById("generateBtn");
    const result = document.getElementById("result");
    const resultMedia = document.getElementById("resultMedia");
    const status = document.getElementById("status");
    const statusText = document.getElementById("statusText");
    const error = document.getElementById("error");
    const loginBtn = document.getElementById("loginBtn");

    async function updateLogin() {
      try {
        if (await puter.auth.isSignedIn()) {
          const user = await puter.auth.getUser();
          loginBtn.textContent = "Signed in as " + (user.username || "Puter user");
        } else {
          loginBtn.textContent = "Sign in to Puter";
        }
      } catch (e) {}
    }

    updateLogin();

    loginBtn.onclick = async () => {
      try {
        await puter.auth.signIn();
        updateLogin();
      } catch (e) {
        showError("Puter sign-in was cancelled.");
      }
    };

    tabs.forEach(tab => {
      tab.onclick = () => {
        tabs.forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        mode = tab.dataset.mode;
        result.style.display = "none";

        if (mode === "create") {
          uploadCard.classList.add("hidden");
          videoSettings.classList.add("hidden");
          imageSettings.classList.remove("hidden");
          promptTitle.textContent = "Describe the image";
          prompt.placeholder = "A highly realistic portrait photo...";
          generateBtn.textContent = "Generate Image";
        }

        if (mode === "edit") {
          uploadCard.classList.remove("hidden");
          videoSettings.classList.add("hidden");
          imageSettings.classList.remove("hidden");
          promptTitle.textContent = "What should I change?";
          prompt.placeholder = "Make the person's nose slightly bigger while keeping the same identity, lighting and background.";
          generateBtn.textContent = "Edit Image";
        }

        if (mode === "video") {
          uploadCard.classList.remove("hidden");
          videoSettings.classList.remove("hidden");
          imageSettings.classList.add("hidden");
          promptTitle.textContent = "Describe the video";
          prompt.placeholder = "Create a realistic cinematic video of this person walking slowly toward the camera...";
          generateBtn.textContent = "Generate Video";
        }
      };
    });

    function fileToDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    fileInput.onchange = async () => {
      previews.innerHTML = "";
      referenceImages = [];
      const files = [...fileInput.files].slice(0, 3);

      for (const file of files) {
        const data = await fileToDataURL(file);
        referenceImages.push(data);
        const img = document.createElement("img");
        img.src = data;
        previews.appendChild(img);
      }
    };

    function showError(message) {
      error.textContent = message;
      error.style.display = "block";
    }

    function clearError() {
      error.style.display = "none";
    }

    generateBtn.onclick = async () => {
      clearError();
      result.style.display = "none";
      resultMedia.innerHTML = "";

      const instruction = prompt.value.trim();
      if (!instruction) {
        showError("Enter a prompt first.");
        return;
      }

      if (mode === "edit" && referenceImages.length === 0) {
        showError("Upload at least one image first.");
        return;
      }

      generateBtn.disabled = true;
      status.style.display = "block";

      try {
        if (mode === "create") {
          statusText.textContent = "Creating image...";
          const model = document.getElementById("imageModel").value;
          const image = await puter.ai.txt2img(instruction, {
            model: model,
            quality: "low"
          });
          resultMedia.appendChild(image);
        }

        if (mode === "edit") {
          statusText.textContent = "Editing image...";
          const model = document.getElementById("imageModel").value;
          const image = await puter.ai.txt2img(instruction, {
            model: model,
            input_images: referenceImages
          });
          resultMedia.appendChild(image);
        }

        if (mode === "video") {
          statusText.textContent = "Generating video...";
          const model = document.getElementById("videoModel").value;
          const seconds = Number(document.getElementById("videoSeconds").value);

          const options = {
            model: model,
            seconds: seconds,
            size: "1280x720"
          };

          if (referenceImages.length > 0) {
            options.input_reference = referenceImages[0];
            if (referenceImages.length > 1) {
              options.reference_images = referenceImages;
            }
          }

          const video = await puter.ai.txt2vid(instruction, options);
          resultMedia.appendChild(video);
        }

        result.style.display = "block";
        result.scrollIntoView({ behavior: "smooth" });
      } catch (e) {
        console.error(e);
        showError(e?.message || "Generation failed. You may have hit the current free allowance.");
      } finally {
        status.style.display = "none";
        generateBtn.disabled = false;
      }
    };
  </script>
</body>
</html>
